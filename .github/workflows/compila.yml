# ---------------------------------------------------------------------------
# Compila il firmware a ogni modifica.
#
# Serve a una cosa sola, ma importante: sapere che il codice compila DAVVERO,
# prima di collegare il cavo. Un errore di compilazione si scopre qui, con un
# pallino rosso, invece che dopo dieci minuti di toolchain sul proprio PC.
#
# Si compila anche con il display spento e con la rete spenta, perche' quelle
# configurazioni le usa poca gente e nessuno le prova: sono proprio quelle in
# cui un #if sbagliato resta nascosto per mesi.
#
# Le opzioni NON si passano con -D sulla riga di comando: un #define dentro
# config.h avrebbe comunque la meglio. Si scrivono in src/config_local.h, che
# config.h include per ultimo, come farebbe un utente vero.
# ---------------------------------------------------------------------------
name: compila

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: completo
            locale: ''
          - nome: senza display
            locale: |
              #undef  ENABLE_DISPLAY
              #define ENABLE_DISPLAY 0
              #undef  ENABLE_TOUCH
              #define ENABLE_TOUCH   0
          - nome: senza rete
            locale: |
              #undef  ENABLE_REROUTE
              #define ENABLE_REROUTE 0
              #undef  ENABLE_OTA
              #define ENABLE_OTA     0
          - nome: schermo in piedi
            locale: |
              #undef  DISPLAY_ROTATION
              #define DISPLAY_ROTATION 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: riusa toolchain e librerie gia' scaricate
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # Le scritte devono stare nel loro spazio. Una troppo larga non da'
      # nessun errore di compilazione: finisce sopra la vicina, e lo si
      # scopre guardando lo schermo nel momento giusto. Gira una volta sola:
      # non dipende dalla variante.
      - name: le scritte stanno nel loro spazio?
        if: matrix.nome == 'completo'
        run: python3 tools/controlla_testi.py

      - name: installa PlatformIO
        run: pip install --upgrade platformio

      - name: scrivi la configurazione della variante
        if: matrix.locale != ''
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          { echo '#pragma once'; echo "$LOCALE"; } > src/config_local.h
          echo '--- src/config_local.h ---'
          cat src/config_local.h

      # set -o pipefail e' obbligatorio: senza, il codice d'uscita della
      # pipeline sarebbe quello di tee, che riesce sempre, e una compilazione
      # fallita passerebbe per verde. E' una trappola in cui si cade una volta
      # sola, ma la si paga cara.
      - name: compila
        shell: bash
        run: |
          set -o pipefail
          pio run -e esp32doit-devkit-v1 2>&1 | tee "$RUNNER_TEMP/compila.log"

      # La partizione del firmware e' 1,625 MB (vedi partizioni.csv). Se si
      # riempie, l'aggiornamento via WiFi smette di funzionare e per rifare le
      # partizioni serve il cavo. Meglio saperlo qui, con un pallino rosso,
      # che in garage.
      - name: controlla che ci sia ancora spazio
        shell: bash
        run: |
          riga=$(grep -o 'Flash:.*' "$RUNNER_TEMP/compila.log" | tail -1)
          [ -n "$riga" ] || { echo "::error::non trovo la riga Flash: nel log"; exit 1; }
          echo "$riga"
          uso=$(printf '%s' "$riga" | grep -oE '[0-9]+(\.[0-9]+)?%' | head -1 | tr -d '%')
          [ -n "$uso" ] || { echo "::error::non riesco a leggere la percentuale"; exit 1; }
          if awk -v u="$uso" 'BEGIN { exit !(u >= 85) }'; then
            echo "::error::il firmware occupa il $uso% della partizione: sotto il 15% di margine non si aggiunge piu' niente senza rifare le partizioni"
            exit 1
          fi
          echo "occupato il $uso%: margine ancora buono"

      - name: quanto occupa, nel dettaglio
        run: pio run -e esp32doit-devkit-v1 -t size | tail -20

      - name: allega il firmware
        if: matrix.nome == 'completo'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32doit-devkit-v1/firmware.bin
          retention-days: 30
